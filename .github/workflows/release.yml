name: Release

on:
  push:
    tags: ["v*.*.*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    name: Test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tag must match package and lockfile versions, and have a CHANGELOG entry
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          echo "tag=$tag package=$pkg lock=$lock"
          test "$tag" = "$pkg" && test "$tag" = "$lock"
          grep -qF "## [$tag]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$tag]' section"; exit 1; }

      - run: npm ci
      - name: Full test suite
        run: npm test

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: frontend-system-design-*.tgz
          if-no-files-found: error

  publish:
    name: GitHub Release + npm
    needs: build
    runs-on: ubuntu-latest
    # Create this environment in repo Settings → Environments and add required reviewers.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: frontend-system-design-*.tgz

      # Publishes the exact tarball that was tested and attached to the release.
      # Enable by setting the repo variable NPM_PUBLISH=true. Prefer npm trusted publishing
      # (no token; npm ≥ 11.5.1); NPM_TOKEN remains a fallback.
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.6.2
          npm publish ./frontend-system-design-*.tgz --provenance --access public

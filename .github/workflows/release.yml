name: Release

on:
  push:
    tags: ["v*.*.*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    name: Test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Tag must match package and lockfile versions, and have a CHANGELOG entry
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          echo "tag=$tag package=$pkg lock=$lock"
          test "$tag" = "$pkg" && test "$tag" = "$lock"
          grep -qF "## [$tag]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$tag]' section"; exit 1; }

      - run: npm ci
      - name: Full test suite
        run: npm test

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: frontend-system-design-*.tgz
          if-no-files-found: error

  publish:
    name: GitHub Release + npm
    needs: build
    runs-on: ubuntu-latest
    # Create this environment in repo Settings → Environments and add required reviewers.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: frontend-system-design-*.tgz

      # Publishes the exact tarball that was tested and attached to the release.
      # Enable by setting the repo variable NPM_PUBLISH=true. Prefer npm trusted publishing
      # (no token; npm ≥ 11.5.1); NPM_TOKEN remains a fallback.
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.6.2
          npm publish ./frontend-system-design-*.tgz --provenance --access public

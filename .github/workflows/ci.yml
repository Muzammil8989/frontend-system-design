name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint notes & validate skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Lint learning notes + README progress
        run: npm run lint:notes
      - name: Notes are synced into the skill's knowledge/
        run: npm run sync:check
      - name: Validate skills, stack files, agents, commands, plugin & companion registry
        run: npm run validate
      - name: Installer tests (node:test)
        run: npm run test:node

  python:
    name: Python engine (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 (our documented floor) has no build for ubuntu-latest (26.04); 24.04 still ships it.
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only — nothing to install)
        run: python -m unittest discover -s tests/python -v
      - name: Smoke-run the scripts
        run: |
          S=skills/frontend-system-design/scripts
          python $S/recommend.py "real-time analytics dashboard for logistics"
          python $S/recommend.py "fitness tracking app for iOS and Android"
          python $S/search.py --domain palettes "fintech trustworthy"
          python $S/budget.py --from "online sneaker store" --format lighthouse
          python $S/budget.py --type mobile-consumer --platform mobile
          python $S/detect_stack.py .
          python $S/audit_scan.py . --max 5
          python skills/product-copywriting/scripts/copy_check.py skills/product-copywriting/SKILL.md --min-score 80
          python skills/git-workflow/scripts/commit_check.py "feat(cli): add --companions all"
          if python skills/git-workflow/scripts/commit_check.py "Added stuff."; then echo "::error::commit_check passed a bad message"; exit 1; fi

  installer:
    name: Installer (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --omit=dev
      - name: Install every integration into a temp project
        shell: bash
        run: |
          T="$RUNNER_TEMP/proj"
          mkdir -p "$T"
          node bin/cli.js install --all --yes --dir "$T" --no-companions
          test -f "$T/.claude/skills/frontend-system-design/SKILL.md"
          test -f "$T/.claude/skills/frontend-system-design/scripts/recommend.py"
          test -f "$T/.claude/skills/frontend-system-design/references/knowledge/INDEX.md"
          test -f "$T/.claude/skills/product-copywriting/scripts/copy_check.py"
          test -f "$T/.claude/skills/git-workflow/scripts/commit_check.py"
          test -f "$T/.claude/commands/fsd/commit.md"
          test -f "$T/.github/prompts/fsd-release.prompt.md"
          test -f "$T/.claude/agents/mobile-engineer.md"
          test -f "$T/.claude/commands/fsd/design.md"
          test -f "$T/.agents/skills/frontend-system-design/references/stacks/flutter.md"
          test -f "$T/.cursor/rules/frontend-system-design.mdc"
          test -f "$T/.github/prompts/fsd-copy.prompt.md"
          test -f "$T/.windsurf/rules/frontend-system-design.md"
          grep -q "fsd:start" "$T/GEMINI.md"
          grep -q "fsd:start" "$T/AGENTS.md"
          grep -q "git-workflow/SKILL.md" "$T/AGENTS.md"
      - name: Opt-in extras (guardrail hooks, MCP config)
        shell: bash
        run: |
          T="$RUNNER_TEMP/extras"
          mkdir -p "$T" && git -C "$T" init -q
          node bin/cli.js install --all --yes --no-companions --hooks --mcp --dir "$T"
          test -f "$T/.claude/hooks/fsd-guard.js"
          grep -q "fsd-guard.js" "$T/.claude/settings.json"
          test -f "$T/.git/hooks/commit-msg"
          grep -q "frontend-system-design" "$T/.mcp.json"
          grep -q "frontend-system-design" "$T/.vscode/mcp.json"
          echo '{"tool_name":"Bash","tool_input":{"command":"git push --force"}}' | node "$T/.claude/hooks/fsd-guard.js" | grep -q '"deny"'
      - name: Re-run is idempotent
        shell: bash
        run: |
          out=$(node bin/cli.js install --all --yes --dir "$RUNNER_TEMP/proj" --no-companions)
          echo "$out"
          if echo "$out" | grep -E " (created|overwritten|appended)$"; then echo "::error::second install changed files"; exit 1; fi
          test "$(grep -c 'fsd:start' "$RUNNER_TEMP/proj/AGENTS.md")" = "1"
      - name: Packed tarball works through npx
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/npx-proj"
          cd "$RUNNER_TEMP/npx-proj"
          npx --yes "file:$(ls "$RUNNER_TEMP"/frontend-system-design-*.tgz)" install --agent claude --yes --no-companions
          test -f .claude/skills/frontend-system-design/SKILL.md

  companions:
    name: Companion skills install (real)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Third-party installers can change upstream; report without blocking merges.
    continue-on-error: true
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'companions')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Install with all companions
        run: |
          mkdir -p "$RUNNER_TEMP/companion-proj"
          node bin/cli.js install --agent claude --dir "$RUNNER_TEMP/companion-proj" --yes --companions all < /dev/null
          ls -la "$RUNNER_TEMP/companion-proj/.claude/skills"

  links:
    name: Links in changed Markdown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Big PRs touch thousands of external links; rate-limited hosts must not hold the PR open.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install markdown-link-check
        run: npm install --global markdown-link-check@3.12.2
      - name: markdown-link-check on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # references/knowledge/ is a generated copy of notes/ (enforced by sync:check), so skip it.
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- '*.md' \
            | grep -v -e '/_' -e '/references/knowledge/' || true)
          if [ -z "$files" ]; then echo "No changed Markdown."; exit 0; fi
          echo "$(echo "$files" | wc -l) file(s) to check"
          echo "$files" | xargs -P 4 -n 15 markdown-link-check --quiet --config .github/markdown-link-check.json
